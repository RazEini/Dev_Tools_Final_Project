services:
  db:
    image: mysql:8.0
    container_name: drupal-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw
      MYSQL_DATABASE: drupal
      MYSQL_USER: drupaluser
      MYSQL_PASSWORD: drupalpass
    ports:
      - "3306:3306"
    networks:
      - drupal-net
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmy-secret-pw"]
      interval: 5s
      timeout: 5s
      retries: 10

  drupal:
    image: drupal:latest
    container_name: drupal-web
    restart: always
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - drupal-net
    volumes:
      - drupal_modules:/var/www/html/modules
      - drupal_profiles:/var/www/html/profiles
      - drupal_themes:/var/www/html/themes
      - drupal_sites:/var/www/html/sites
      - ./config:/opt/drupal/config

networks:
  drupal-net:
    driver: bridge

volumes:
  db_data:
  drupal_modules:
  drupal_profiles:
  drupal_themes:
  drupal_sites: